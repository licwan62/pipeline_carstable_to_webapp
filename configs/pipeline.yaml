# 流水线唯一配置：输入工作表、字段映射、步骤和工作目录都在这里维护。
# 可选 AI 补全通过环境变量启用：AI_ENRICH=1、AI_API_KEY、AI_MODEL、AI_BASE_URL。
repos:
  pipeline: "."
  compress: "../../Scripts/compress_to_size_chart"

paths:
  # 产线输入：all_cars_data 的已发布交付物（相对本仓库；两仓库同级）。input_dir 仅供旧的手工输入/增量流程使用。
  a0_output_dir: "../all_cars_data/A0.尺码计算/output"
  a2_output_dir: "../all_cars_data/A2.压缩尺寸信息/output"
  size_code_map_file: "../all_cars_data/A0.尺码计算/data/参考/新旧尺码对应/新旧尺码对应2.csv"
  input_dir: "input/0925"
  artifact_root: "artifact"
  public_dir: "public"
  nas_publish_dir: '\\NAS8824B4\Web\car'
  logs_dir: "logs"

file_rules:
  input_patterns: ["*.xlsx", "*.xlsm", "*.csv"]

# 每个 Excel/CSV 文件就是一个店铺；stem 是不含扩展名的店铺名。
# 例如 07-HNT.csv 会生成 store=07-HNT、label=07-HNT尺码匹配表。
input:
  # size-chart 网站加载 US 及其店铺线；EU/RU 仍由 A2 生成，但不进入网站。
  source: all_cars_data
  lines: [US, HNT, TM, TM_拆分]
  store:
    store: "{stem}"
    label: "{stem}尺码匹配表"
    sheet: "{stem}尺码匹配"
    header_row: 1
    columns: MODEL,版本,YEAR,TYPE,CAB,BED,销量合计,L-MM,W-MM,H-MM,长度余量,SIZE
  csv:
    encoding: utf-8-sig
  # 修正已知来源中的表头笔误；物化时统一为下游标准字段。
  header_aliases:
    S8MAKE: MAKE
  required_fields: [品牌, 前台车型, 年份区间, 最终尺码]

columns:
  品牌: [MAKE, 品牌]
  前台车型: [MODEL, 前台车型]
  结构: [结构]
  版本: [版本]
  年份区间: [YEAR, 年份区间]
  最终尺码: [确认尺码, 自动尺码, 最终尺码, 对应尺码]
  驾驶室类型: [CAB, 驾驶室类型]
  货斗长度_ft: [BED, 货斗长度_ft]
  子车系: [SUB-MODEL, 子车系]
  分类: [分类]

defaults:
  分类: ""

variables:
  scripts_root: "{root}/.."
  compressed_fitment_dir: "{artifact_dir}/01_compressed_fitment"
  user_size_json_file: "{artifact_dir}/02_user_size.json"
  user_size_rules_file: "{root}/configs/user-size-rules.json"
  type_structure_abbreviations_file: "{root}/configs/type-structure-abbreviations.json"
  # TYPE 人工确认表：自动缩写有损（去 Inc:、删字母、截断）时需在此填写 确认TYPE；待确认清单每次写入批次。
  type_confirm_file: "{root}/configs/type-manual-confirm.csv"
  type_pending_file: "{artifact_dir}/02_type_待确认.csv"
  user_size_ai_config_file: "{root}/configs/ai-user-size.yaml"
  store_csv_dir: "{artifact_dir}/03_store_csv"
  store_html_dir: "{artifact_dir}/04_store_html"
  site_workspace_dir: "{artifact_dir}/05_site_workspace"
  webapp_repo: "{scripts_root}/publish_tables_to_webapp"

steps:
  import_a2_compressed:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/import_a2_compressed.py, --a0-output, "{a0_output_dir}", --a2-output, "{a2_output_dir}", --config, "{source_config}", --output-dir, "{input_tables_dir}", --output-config, "{pipeline_config}", --compressed-root, "{compressed_fitment_dir}"]
    check_exists: ["{input_tables_dir}", "{pipeline_config}", "{compressed_fitment_dir}"]

  build_user_size_json:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/build_user_size_json.py, --compress-root, "{compressed_fitment_dir}", --config, "{pipeline_config}", --rules, "{user_size_rules_file}", --size-code-map, "{size_code_map_file}", --type-abbreviations, "{type_structure_abbreviations_file}", --type-confirm, "{type_confirm_file}", --type-pending-output, "{type_pending_file}", --ai-config, "{user_size_ai_config_file}", --output, "{user_size_json_file}"]
    check_exists: ["{user_size_json_file}"]

  export_store_csv:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/export_user_size_json_tables.py, --input, "{user_size_json_file}", --output-root, "{store_csv_dir}"]
    check_exists: ["{store_csv_dir}"]

  generate_store_html:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/generate_all_html.py, --export-root, "{store_csv_dir}", --output-root, "{store_html_dir}", --config-path, "{root}/configs/html-style.yaml", --html-script, "{scripts_root}/generate_size_chart_html/tsv_to_size_chart_html.py"]
    check_exists: ["{store_html_dir}"]

  build_public_site:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/build_publish_site.py, --publish-repo, "{webapp_repo}", --html-root, "{store_html_dir}", --pipeline-config, "{pipeline_config}", --html-style-config, "{root}/configs/html-style.yaml", --workspace, "{site_workspace_dir}", --site-output, "{public_dir}"]
    check_exists: ["{case_public}/index.html"]

  publish_nas_site:
    enabled: true
    repo: pipeline
    command: ["{python}", tools/publish_site_copy.py, --source, "{public_dir}", --destination, "{nas_publish_dir}", --best-effort]

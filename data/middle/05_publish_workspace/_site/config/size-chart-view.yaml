    empty_label: All cabs
    source: CAB
    atomize: true
  bed:
    label: BED
    empty_label: All beds
    source: BED
    atomize: true
table_fields:
  const:
    label: 结构
    source: CONST
  cab:
    label: CAB
    source: CAB
  bed:
    label: BED
    source: BED
size_reference:
  sheet: ALL尺码
  header_row: 1

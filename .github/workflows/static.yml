name: Deploy Pages and package Nginx site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    env:
      SITE_DIR: data/output/site
      NGINX_ZIP: carstable-webapp-nginx-${{ github.sha }}.zip
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install validator dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Verify Pages artifact
        run: |
          test -f "$SITE_DIR/index.html"
          python tools/validate_publish_site.py "$SITE_DIR"
      - name: Package complete site for Nginx
        run: |
          (
            cd "$SITE_DIR"
            zip -q -r "$GITHUB_WORKSPACE/$NGINX_ZIP" .
          )
          unzip -tq "$NGINX_ZIP"
          unzip -Z1 "$NGINX_ZIP" | grep -qx 'index.html'
      - name: Upload Nginx deployment ZIP
        id: nginx-artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NGINX_ZIP }}
          archive: false
          if-no-files-found: error
      - name: Add Nginx ZIP to workflow summary
        run: |
          echo "### Nginx manual deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download $NGINX_ZIP](${{ steps.nginx-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ env.SITE_DIR }}
          include-hidden-files: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

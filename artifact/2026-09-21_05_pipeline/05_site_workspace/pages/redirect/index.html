<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://licwan62.github.io/pipeline_carstable_to_webapp/">
  <title>正在前往最新尺码查询站点</title>
  <style>
    body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #182230; background: #f4f7fb; }
    main { max-width: 640px; margin: 18vh auto 0; padding: 32px; background: #fff; border-radius: 18px; box-shadow: 0 16px 48px #1f29371f; }
    a { color: #1769aa; }
  </style>
</head>
<body>
  <main>
    <h1>站点已迁移</h1>
    <p>正在前往最新的尺码查询站点。若浏览器没有自动跳转，请使用下面的链接。</p>
    <p><a id="canonical-link" href="https://licwan62.github.io/pipeline_carstable_to_webapp/">打开最新站点</a></p>
  </main>
  <script>
    (function () {
      const base = "https://licwan62.github.io/pipeline_carstable_to_webapp/";
      const supported = new Set(["size-chart.html", "size-charts.html", "size-match.html", "size-ref.html"]);
      const current = window.location.pathname.split("/").pop() || "";
      const target = new URL(supported.has(current) ? current : "", base);
      target.search = window.location.search;
      target.hash = window.location.hash;
      document.getElementById("canonical-link").href = target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
</html>
